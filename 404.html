<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuvan Digital Marketing | Performance Marketing & Digital Growth</title><meta name="description" content="Yuvan Digital Marketing — full-service digital marketing and performance marketing for businesses, startups, brands and creators."><meta name="theme-color" content="#080808"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}</script><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script><style>html{scroll-behavior:smooth}body{margin:0;background:#070707;color:#f7f7f5;font-family:Inter,ui-sans-serif,system-ui}*{box-sizing:border-box}.grid-bg{background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px}.noise:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.025;background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity=".8"/%3E%3C/svg%3E')}.glow{box-shadow:0 0 80px rgba(255,255,255,.08)}.gradient-text{background:linear-gradient(110deg,#fff 15%,#9ca3af 55%,#fff 85%);-webkit-background-clip:text;background-clip:text;color:transparent}.pill{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);backdrop-filter:blur(12px)}.accent{color:#c7ff4d}.accent-bg{background:#c7ff4d;color:#0a0a0a}.section{padding:110px 0}.card{border:1px solid rgba(255,255,255,.1);background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));backdrop-filter:blur(18px)}.cursor-dot{position:fixed;width:14px;height:14px;border-radius:50%;background:#c7ff4d;mix-blend-mode:screen;pointer-events:none;z-index:100;transform:translate(-50%,-50%);transition:transform .08s ease}.marquee{overflow:hidden;white-space:nowrap}.marquee-track{display:inline-flex;animation:scroll 22s linear infinite}@keyframes scroll{to{transform:translateX(-50%)}}@media(max-width:768px){.section{padding:76px 0}.cursor-dot{display:none}}</style></head><body class="noise"><div id="root"></div><script>
const {useEffect,useState}=React; const {motion}=window.framerMotion;
const WA='919962012688', EMAIL='yuvandigitalmarketing@gmail.com', IG='https://www.instagram.com/yuvandigitalmarketing/', LI='https://www.linkedin.com/in/yuvan-shankar-v/';
const wa=(text='Hi Yuvan, I would like to discuss digital marketing support for my business.')=>`https://wa.me/${WA}?text=${encodeURIComponent(text)}`;
function App(){const [menu,setMenu]=useState(false); const [path,setPath]=useState(location.pathname); useEffect(()=>{const f=()=>setPath(location.pathname);addEventListener('popstate',f);return()=>removeEventListener('popstate',f)},[]); const go=(p)=>{history.pushState({},'',p);setPath(p);setMenu(false);scrollTo(0,0)}; const page=path.split('/')[1]||'home'; return <><Cursor/><Nav menu={menu} setMenu={setMenu} go={go}/>{page==='home'?<Home go={go}/>:page==='services'?<Services go={go}/>:page==='work'?<Work go={go}/>:page==='about'?<About go={go}/>:<Contact/>}<Floating go={go}/><Footer go={go}/></>}
function Cursor(){useEffect(()=>{const e=document.querySelector('.cursor-dot');const m=x=>{e.style.left=x.clientX+'px';e.style.top=x.clientY+'px'};addEventListener('mousemove',m);return()=>removeEventListener('mousemove',m)},[]);return <div className="cursor-dot"/>}
function Nav({menu,setMenu,go}){return <header className="fixed top-0 left-0 right-0 z-50"><div className="mx-auto max-w-7xl px-5 pt-4"><nav className="pill rounded-2xl px-4 py-3 flex items-center justify-between"><button onClick={()=>go('/')} className="font-black tracking-tight text-lg">YUVAN<span className="accent">.</span></button><div className="hidden md:flex items-center gap-7 text-sm text-white/65">{[['/services','Services'],['/work','Work'],['/about','About'],['/contact','Contact']].map(([p,t])=><button key={p} onClick={()=>go(p)} className="hover:text-white transition">{t}</button>)}</div><div className="flex items-center gap-2"><a href={wa()} target="_blank" className="hidden sm:inline-flex accent-bg rounded-xl px-4 py-2 text-sm font-bold">Start a conversation</a><button className="md:hidden p-2" onClick={()=>setMenu(!menu)}>{menu?'✕':'☰'}</button></div></nav>{menu&&<div className="md:hidden pill rounded-2xl mt-2 p-4 flex flex-col gap-3">{[['/services','Services'],['/work','Work'],['/about','About'],['/contact','Contact']].map(([p,t])=><button className="text-left py-2" onClick={()=>go(p)} key={p}>{t}</button>)}</div>}</div></header>}
function Home({go}){return <main><section className="min-h-screen grid-bg relative overflow-hidden flex items-center"><div className="absolute inset-0 bg-[radial-gradient(circle_at_75%_35%,rgba(199,255,77,.12),transparent_28%),radial-gradient(circle_at_20%_80%,rgba(255,255,255,.06),transparent_30%)]"/><div className="max-w-7xl mx-auto px-5 pt-28 w-full relative"><motion.div initial={{opacity:0,y:25}} animate={{opacity:1,y:0}} transition={{duration:.7}} className="max-w-5xl"><span className="pill rounded-full px-4 py-2 text-xs uppercase tracking-[.2em] text-white/65">Full-Service Digital Marketing · Performance Marketing</span><h1 className="text-[clamp(3.5rem,9vw,8.6rem)] leading-[.86] tracking-[-.075em] font-black mt-7">Marketing that<br/><span className="gradient-text">moves business.</span></h1><p className="mt-8 max-w-2xl text-lg md:text-xl leading-relaxed text-white/58">I help businesses turn attention into enquiries, leads and growth through strategy, creative execution, paid media and measurable digital marketing.</p><div className="mt-9 flex flex-col sm:flex-row gap-3"><button onClick={()=>go('/contact')} className="accent-bg rounded-2xl px-6 py-4 font-black">Tell me about your business ↗</button><button onClick={()=>go('/work')} className="pill rounded-2xl px-6 py-4 font-bold hover:bg-white/10">See selected work</button></div></motion.div><div className="mt-16 grid grid-cols-2 md:grid-cols-4 gap-3 max-w-5xl">{[['5K+','Reel views → 50K+'],['971','Engagement from 116'],['₹5K','Meta campaign spend'],['80K+','Meta reach']].map(([n,l],i)=><motion.div key={l} initial={{opacity:0,y:15}} animate={{opacity:1,y:0}} transition={{delay:.15+i*.08}} className="card rounded-2xl p-5"><div className="text-3xl font-black">{n}</div><div className="text-xs text-white/45 mt-2">{l}</div></motion.div>)}</div></div></section><Marquee/><section className="section"><div className="max-w-7xl mx-auto px-5"><SectionIntro eyebrow="WHAT I DO" title="From strategy to performance — without the usual marketing fluff."/><div className="grid md:grid-cols-3 gap-4 mt-12">{[['01','Performance Marketing','Meta & Google Ads built around business goals, targeting, creative testing and optimisation.'],['02','Digital Growth','A practical digital presence across social media, SEO, content and conversion touchpoints.'],['03','Creative Marketing','Campaign ideas and social-first creatives that make brands easier to notice and remember.']].map(([n,t,d])=><motion.div whileHover={{y:-7}} className="card rounded-3xl p-7 min-h-64" key={n}><div className="accent text-xs font-bold">{n}</div><h3 className="text-2xl font-black mt-14">{t}</h3><p className="text-white/50 leading-relaxed mt-3">{d}</p></motion.div>)}</div></div></section><section className="section pt-0"><div className="max-w-7xl mx-auto px-5"><div className="card rounded-[2rem] p-8 md:p-14 relative overflow-hidden"><div className="absolute -right-20 -top-20 w-72 h-72 rounded-full bg-lime-300/10 blur-3xl"/><div className="max-w-3xl relative"><span className="accent text-xs font-bold tracking-[.2em]">THE APPROACH</span><h2 className="text-4xl md:text-6xl font-black tracking-tight mt-4">Think. Create. Launch. Measure. Improve.</h2><p className="text-white/50 text-lg leading-relaxed mt-5">Every campaign starts with a business objective, not a trendy tactic. The work is planned, launched, measured and improved around what actually matters.</p></div></div></div></section><CTA go={go}/></main>}
function Marquee(){return <div className="border-y border-white/10 py-5 marquee text-white/30 text-xs uppercase tracking-[.3em]"><div className="marquee-track">{Array(2).fill(['META ADS','GOOGLE ADS','SEO','SOCIAL MEDIA','CONTENT','LEAD GENERATION','DIGITAL STRATEGY','CAMPAIGN MANAGEMENT']).flat().map((x,i)=><span className="mx-8" key={i}>{x} <b className="accent">✦</b></span>)}</div></div>}
function SectionIntro({eyebrow,title}){return <div className="max-w-3xl"><div className="accent text-xs font-bold tracking-[.22em]">{eyebrow}</div><h2 className="text-4xl md:text-6xl font-black tracking-tight mt-4">{title}</h2></div>}
function Services({go}){const services=[['Performance Marketing','Meta Ads · Google Ads · Campaign Strategy · Lead Generation · Optimisation'],['Social Media Marketing','Content Planning · Social Strategy · Community Presence · Creative Direction'],['SEO & Search Visibility','On-page SEO · Local visibility · Search-focused content · Website optimisation'],['Content & Creative','Campaign concepts · Social creatives · Reels direction · Promotional content'],['Website & Digital Presence','Landing pages · Website management · Conversion-focused improvements'],['Marketing Support','Campaign planning · Reporting · Digital audits · Ongoing consultation']];return <main className="pt-28"><section className="section"><div className="max-w-7xl mx-auto px-5"><SectionIntro eyebrow="SERVICES" title="One partner for the digital work that moves your business forward."/><p className="max-w-2xl text-white/50 text-lg mt-6">Choose what you need today. The strategy can scale as the business grows.</p><div className="grid md:grid-cols-2 gap-4 mt-12">{services.map(([t,d],i)=><motion.div whileHover={{scale:1.01}} className="card rounded-3xl p-7 md:p-9" key={t}><div className="flex justify-between"><span className="accent font-bold text-sm">0{i+1}</span><span className="text-white/25">↗</span></div><h3 className="text-3xl font-black mt-12">{t}</h3><p className="text-white/50 mt-3 leading-relaxed">{d}</p></motion.div>)}</div></div></section><CTA go={go}/></main>}
function Work(){return <main className="pt-28"><section className="section"><div className="max-w-7xl mx-auto px-5"><SectionIntro eyebrow="SELECTED WORK" title="Proof over promises."/><p className="max-w-2xl text-white/50 text-lg mt-6">A selection of published campaign and content results. Figures are based on the work presented on the previous site and are retained as approved portfolio proof.</p><div className="grid md:grid-cols-2 gap-5 mt-12">{[['Geethai Studio','Social / Reels','5,163 → 50,647 views','116 → 971 engagement','portfolio-1.webp'],['Naturals Signature','Meta Ads','₹5,000 campaign spend','50+ message leads · 80+ call leads','portfolio-2.webp'],['Car Bathe','Google / Local','10K+ Google impressions','Local visibility & enquiry focus','portfolio-3.webp'],['Campaign Creative','Social Media','Creative execution','Social-first marketing assets','portfolio-4.webp']].map(([name,type,a,b,img],i)=><motion.article whileHover={{y:-8}} className="card rounded-3xl overflow-hidden" key={name}><div className="aspect-[16/9] bg-white/5 overflow-hidden"><img src={'assets/'+img} className="w-full h-full object-cover opacity-85 hover:scale-105 transition duration-700"/></div><div className="p-7"><div className="flex justify-between text-xs text-white/35"><span>{type}</span><span>0{i+1}</span></div><h3 className="text-2xl font-black mt-3">{name}</h3><div className="mt-5 space-y-2 text-sm"><div className="text-white/80">↗ {a}</div><div className="text-white/45">↗ {b}</div></div></div></motion.article>)}</div></div></section><section className="section pt-0"><div className="max-w-7xl mx-auto px-5"><div className="card rounded-3xl p-8 md:p-12"><span className="accent text-xs font-bold">CERTIFICATIONS</span><h2 className="text-3xl md:text-5xl font-black mt-4">Learning that supports the work.</h2><div className="grid md:grid-cols-3 gap-4 mt-8">{[['HubSpot','Digital Marketing'],['HubSpot','Social Media'],['FITA Academy','Digital Marketing']].map(([a,b])=><div className="pill rounded-2xl p-5" key={a+b}><div className="font-bold">{a}</div><div className="text-white/45 text-sm mt-1">{b}</div></div>)}</div></div></div></section></main>}
function About({go}){return <main className="pt-28"><section className="section"><div className="max-w-7xl mx-auto px-5 grid lg:grid-cols-[.9fr_1.1fr] gap-12 items-center"><div><div className="rounded-[2rem] overflow-hidden border border-white/10 glow"><img src="assets/yuvan.webp" className="w-full object-cover"/></div></div><div><div className="accent text-xs font-bold tracking-[.2em]">ABOUT YUVAN</div><h1 className="text-5xl md:text-7xl font-black tracking-tight mt-4">A digital marketer focused on work that leads somewhere.</h1><p className="text-white/55 text-lg leading-relaxed mt-7">Yuvan Digital Marketing is my independent digital marketing brand, built around full-service marketing and performance-focused execution.</p><p className="text-white/55 text-lg leading-relaxed mt-5">My role can cover the thinking, the campaign setup, the creative coordination, the optimisation and the digital presence — with the goal of making marketing useful to the business.</p><button onClick={()=>go('/contact')} className="accent-bg rounded-2xl px-6 py-4 font-black mt-8">Work with me ↗</button></div></div></section><section className="section pt-0"><div className="max-w-7xl mx-auto px-5"><div className="grid md:grid-cols-3 gap-4">{[['BUSINESS FIRST','Start with the objective, audience and offer.'],['DATA AWARE','Use performance signals to improve decisions.'],['NO EMPTY PROMISES','Show the work and communicate clearly.']].map(([a,b])=><div className="card rounded-3xl p-7" key={a}><div className="accent text-xs font-bold">{a}</div><p className="text-xl font-bold mt-10">{b}</p></div>)}</div></div></section></main>}
function Contact(){const [form,setForm]=useState({name:'',business:'',phone:'',email:'',help:'',budget:'',message:''});const change=e=>setForm({...form,[e.target.name]:e.target.value});const submit=e=>{e.preventDefault();const text=`Hi Yuvan, I would like to enquire about digital marketing support.\n\nName: ${form.name}\nBusiness/Brand: ${form.business}\nWhatsApp/Phone: ${form.phone}\nEmail: ${form.email}\nNeed help with: ${form.help}\nApprox. budget: ${form.budget}\nMessage: ${form.message}`;open(wa(text),'_blank')};return <main className="pt-28"><section className="section"><div className="max-w-7xl mx-auto px-5 grid lg:grid-cols-[.8fr_1.2fr] gap-12"><div><div className="accent text-xs font-bold tracking-[.2em]">LET'S TALK</div><h1 className="text-5xl md:text-7xl font-black tracking-tight mt-4">Tell me what you want to grow.</h1><p className="text-white/50 text-lg leading-relaxed mt-6">Share a few details. When you submit, WhatsApp opens with your enquiry ready to send. I can then call you, understand the requirement and book an appointment.</p><div className="mt-8 space-y-3"><a href={wa()} target="_blank" className="card rounded-2xl p-5 flex justify-between">WhatsApp <span className="accent">↗</span></a><a href={'mailto:'+EMAIL} className="card rounded-2xl p-5 flex justify-between">Email <span className="accent">↗</span></a><a href={IG} target="_blank" className="card rounded-2xl p-5 flex justify-between">Instagram <span className="accent">↗</span></a></div></div><form onSubmit={submit} className="card rounded-[2rem] p-6 md:p-9"><div className="grid md:grid-cols-2 gap-4">{[['name','Name'],['business','Business / Brand'],['phone','WhatsApp / Phone'],['email','Email']].map(([n,l])=><label className="block" key={n}><span className="text-xs text-white/45">{l}</span><input required={n!=='email'} name={n} value={form[n]} onChange={change} className="mt-2 w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-lime-300/60"/></label>)}</div><label className="block mt-4"><span className="text-xs text-white/45">What do you need help with?</span><select required name="help" value={form.help} onChange={change} className="mt-2 w-full rounded-xl bg-[#111] border border-white/10 px-4 py-3"><option value="">Select one</option><option>Performance / Paid Ads</option><option>Social Media Marketing</option><option>SEO</option><option>Website / Digital Presence</option><option>Full-Service Digital Marketing</option><option>Other</option></select></label><label className="block mt-4"><span className="text-xs text-white/45">Approximate budget</span><select name="budget" value={form.budget} onChange={change} className="mt-2 w-full rounded-xl bg-[#111] border border-white/10 px-4 py-3"><option value="">Prefer not to say</option><option>Under ₹10,000</option><option>₹10,000 – ₹25,000</option><option>₹25,000 – ₹50,000</option><option>₹50,000+</option><option>Let's discuss</option></select></label><label className="block mt-4"><span className="text-xs text-white/45">Message</span><textarea required name="message" value={form.message} onChange={change} rows="5" className="mt-2 w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-lime-300/60"/></label><button className="accent-bg rounded-2xl px-6 py-4 font-black w-full mt-5">Send enquiry on WhatsApp ↗</button><p className="text-xs text-white/30 text-center mt-3">Your phone number is only revealed when you choose to start a WhatsApp chat.</p></form></div></section></main>}
function CTA({go}){return <section className="section pt-0"><div className="max-w-7xl mx-auto px-5"><div className="rounded-[2rem] accent-bg p-8 md:p-14 flex flex-col md:flex-row md:items-end justify-between gap-8"><div><div className="text-xs font-black tracking-[.2em] opacity-60">READY WHEN YOU ARE</div><h2 className="text-4xl md:text-6xl font-black tracking-tight mt-3 max-w-2xl">Your next marketing move starts with a conversation.</h2></div><button onClick={()=>go('/contact')} className="rounded-2xl bg-black text-white px-6 py-4 font-black shrink-0">Send an enquiry ↗</button></div></div></section>}
function Floating({go}){return <div className="fixed right-4 bottom-4 z-40 flex flex-col gap-2"><a href={wa()} target="_blank" className="rounded-full accent-bg px-5 py-3 text-sm font-black shadow-2xl">WhatsApp ↗</a><button onClick={()=>go('/contact')} className="rounded-full pill px-5 py-3 text-sm font-bold">Enquire</button></div>}
function Footer({go}){return <footer className="border-t border-white/10 py-10"><div className="max-w-7xl mx-auto px-5 flex flex-col md:flex-row justify-between gap-6"><div><div className="font-black text-xl">YUVAN<span className="accent">.</span></div><div className="text-white/35 text-sm mt-2">Full-Service Digital Marketing · Performance Marketing</div></div><div className="flex flex-wrap gap-5 text-sm text-white/45">{[['/services','Services'],['/work','Work'],['/about','About'],['/contact','Contact']].map(([p,t])=><button onClick={()=>go(p)} key={p} className="hover:text-white">{t}</button>)}<a href={LI} target="_blank">LinkedIn</a><a href={IG} target="_blank">Instagram</a></div></div><div className="max-w-7xl mx-auto px-5 mt-8 text-xs text-white/25">© 2026 Yuvan Digital Marketing. All rights reserved.</div></footer>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
