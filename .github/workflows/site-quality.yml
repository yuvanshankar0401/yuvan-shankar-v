name: Site Quality

on:
  push:
    branches: [main, chore/github-quality]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate HTML and CSS
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: true
          format: text

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --exclude 'https://(www\\.)?instagram\\.com/.*'
            --exclude 'https://(www\\.)?linkedin\\.com/.*'
            --exclude 'https://(www\\.)?facebook\\.com/.*'
            './**/*.html'
          fail: true

      - name: Check repository for accidental secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
