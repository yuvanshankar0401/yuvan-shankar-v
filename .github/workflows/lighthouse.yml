name: Lighthouse Performance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Audit live site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://yuvanshankar0401.github.io/yuvan-shankar-v/
            https://yuvanshankar0401.github.io/yuvan-shankar-v/services.html
            https://yuvanshankar0401.github.io/yuvan-shankar-v/portfolio.html
          uploadArtifacts: true
          temporaryPublicStorage: true
